<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoji Chat — Natural & Context-Aware Bots</title>

  <!-- OG метатеги (динамически обновляются) -->
  <meta property="og:title" content="Сообщение от вселенной" />
  <meta property="og:description" content="Тебе пришло секретное сообщение..." />
  <meta property="og:image" content="" />
  <meta property="og:url" content="" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
    body {
      background: #f0f0f0;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #e0e0e0;
      position: relative;
    }
    #likes-display {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      display: flex;
      gap: 12px;
      user-select: none;
    }
    .likes-counter {
      cursor: pointer;
    }
    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: cover;
      image-rendering: -webkit-optimize-contrast;
    }
    #refresh-btn {
      width: 24px;
      height: 24px;
      margin-left: 8px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    #refresh-btn:hover {
      opacity: 1;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 12px;
    }
    .message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.4;
      position: relative;
    }
    .system {
      align-self: center;
      background: #e0e0e0;
      color: #555;
      font-size: 0.9em;
      border-radius: 12px;
      text-align: center;
      padding: 6px 12px;
    }
    .sticker-container {
      margin: 8px auto;
      text-align: center;
      position: relative;
    }
    .sticker-img {
      height: 100px;
      image-rendering: -webkit-optimize-contrast;
    }
    .action-btns {
      position: absolute;
      bottom: -8px;
      right: 8px;
      display: flex;
      gap: 12px;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }
    .action-btns span {
      cursor: pointer;
    }

    .player1 { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 4px; }
    .player2 { align-self: flex-start; background: white; border-bottom-left-radius: 4px; }

    #choice-area {
      height: 35vh;
      padding: 0 16px 16px;
      background: white;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      position: relative;
      border-top: 1px solid #ddd;
      scroll-behavior: auto;
    }

    .emoji-canvas {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }

    .emoji-canvas.virtual-scroll {
      transition: transform 0.1s linear;
    }

    .emoji-canvas.disabled-all .choice-btn {
      opacity: 0.4;
      pointer-events: none;
    }

    .choice-btn {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .choice-btn:hover { transform: scale(1.2); }
    .choice-btn img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
    }

    /* Scanner overlay */
    #scanner-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2000;
      display: none;
    }

    .scanner-line {
      position: absolute;
      height: 3px;
      background: cyan;
      box-shadow: 0 0 8px cyan, 0 0 16px cyan;
      transform-origin: center;
      transform: scaleX(0);
      opacity: 1;
    }

    @keyframes glitch-scan {
      0%, 100% { 
        opacity: 1; 
        text-shadow: 0 0 5px cyan; 
        transform: translateX(0);
      }
      92% { 
        opacity: 0.3; 
        text-shadow: 2px 0 5px red, -2px 0 8px cyan; 
        transform: translateX(2px);
      }
      95% { 
        opacity: 1; 
        text-shadow: 0 0 5px cyan; 
        transform: translateX(-2px);
      }
      97% { 
        opacity: 0.5; 
        text-shadow: -2px 0 8px red, 2px 0 5px cyan; 
        transform: translateX(1px);
      }
    }

    .scanner-line.scanning {
      animation: scan-down 4s linear forwards, glitch-scan 0.15s infinite;
    }

    @keyframes scan-down {
      0% { 
        top: var(--start-top); 
        opacity: 1;
      }
      95% {
        opacity: 1;
      }
      100% { 
        top: var(--end-top); 
        opacity: 0;
      }
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      border-radius: 12px;
      padding: 16px;
    }
    .modal-close {
      float: right;
      cursor: pointer;
      font-size: 20px;
      margin-bottom: 8px;
    }
    .collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 12px;
    }
    .collection-item {
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
    }
    .collection-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: -webkit-optimize-contrast;
    }
    .fade { opacity: 1; transition: opacity 0.4s ease; }
    .fade.out { opacity: 0; }

    /* Share modal */
    #share-modal .modal-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #share-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #share-preview img {
      height: 120px;
      border-radius: 8px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-group label {
      font-size: 14px;
      color: #666;
    }
    .input-group input {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    #share-send {
      align-self: flex-end;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="status-bar">
    <div style="display: flex; align-items: center;">
      <img id="their-avatar" class="avatar" src="image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Ccircle cx='30' cy='30' r='28' fill='%23ccc'/%3E%3C/svg%3E" />
      <div id="refresh-btn" title="Найти нового собеседника">🔄</div>
    </div>
    <div id="likes-display">
      <div id="my-likes" class="likes-counter">❤️ 0</div>
      <div id="shared-likes" class="likes-counter">💞 0</div>
    </div>
    <img id="my-avatar" class="avatar" src="image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Ccircle cx='30' cy='30' r='28' fill='%23007bff'/%3E%3C/svg%3E" />
  </div>
  <div id="chat"></div>
  <div id="choice-area">
    <div class="emoji-canvas virtual-scroll" id="emoji-canvas"></div>
  </div>

  <div id="scanner-overlay">
    <div class="scanner-line" id="dynamic-scanner"></div>
  </div>

  <!-- Share Modal -->
  <div id="share-modal" class="modal">
    <div class="modal-content">
      <div class="modal-close" data-target="share-modal">✕</div>
      <h3>Отправить в мир</h3>
      <div id="share-preview">
        <img id="share-mix-img" src="" />
      </div>
      <div class="input-group">
        <label id="secret-label">🤫 Секретное сообщение</label>
        <input type="text" id="secret-input" placeholder="Напиши что-то особенное..." maxlength="100" />
      </div>
      <div class="input-group">
        <label>От кого</label>
        <input type="text" id="from-input" value="от вселенной" maxlength="50" />
      </div>
      <button id="share-send">✈️</button>
    </div>
  </div>

  <!-- Other modals -->
  <div id="my-likes-modal" class="modal">
    <div class="modal-content">
      <div class="modal-close" data-target="my-likes-modal">✕</div>
      <h3>Мои лайки</h3>
      <div class="collection-grid" id="my-likes-grid"></div>
    </div>
  </div>

  <div id="shared-likes-modal" class="modal">
    <div class="modal-content">
      <div class="modal-close" data-target="shared-likes-modal">✕</div>
      <h3>Совместные лайки</h3>
      <div class="collection-grid" id="shared-likes-grid"></div>
    </div>
  </div>

  <!-- html2canvas CDN -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script>
    // === Обработка входящих ссылок (OG share) ===
    function handleIncomingShare() {
      const urlParams = new URLSearchParams(window.location.search);
      const mixUrl = urlParams.get('mix');
      const secret = urlParams.get('secret') || '';
      const from = urlParams.get('from') || 'от вселенной';

      if (mixUrl) {
        // Обновляем OG-мета
        const ogTitle = `Сообщение ${from}: ${secret || '...'}`;
        document.querySelector('meta[property="og:title"]').content = ogTitle;
        document.querySelector('meta[property="og:description"]').content = secret || 'Тебе пришло сообщение...';
        document.querySelector('meta[property="og:url"]').content = window.location.href;

        // Показываем в чате
        setTimeout(() => {
          addSystemMessage(`🤖 Сообщение ${from}...`);
          if (secret) addSystemMessage(`🤫 ${secret}`);
          addStickerFromUrl(mixUrl, false); // без like-логики
          // Запускаем игру
          setTimeout(() => {
            currentBaseEmoji = window.points[Math.floor(Math.random() * window.points.length)];
            interlocutorActive = true;
            addMessage(currentBaseEmoji, 'player2');
            showChoices();
          }, 1500);
        }, 500);
      }
    }

    // === Добавление стикера из URL (без like) ===
    function addStickerFromUrl(url, withLike = true) {
      const container = document.createElement('div');
      container.className = 'message system sticker-container';

      const img = document.createElement('img');
      img.className = 'sticker-img';
      img.src = url;
      img.onerror = () => img.style.display = 'none';

      container.appendChild(img);

      if (withLike) {
        const actionDiv = document.createElement('div');
        actionDiv.className = 'action-btns';
        actionDiv.innerHTML = `<span class="like-btn" data-url="${url}" data-bot-liked="false">♡</span> <span class="share-btn" data-url="${url}">✈️</span>`;
        container.appendChild(actionDiv);

        // Like logic
        const likeBtn = actionDiv.querySelector('.like-btn');
        const shareBtn = actionDiv.querySelector('.share-btn');
        attachLikeLogic(likeBtn, url);
        shareBtn.addEventListener('click', () => openShareModal(url));
      }

      chat.appendChild(container);
      requestAnimationFrame(() => chat.scrollTop = chat.scrollHeight);
    }

    // === Share Modal ===
    const secretMessages = [
      "🤫 Секретное сообщение (RU)",
      "🤫 Secret message (EN)",
      "🤫 秘密消息 (CN)"
    ];

    function openShareModal(mixUrl) {
      const modal = document.getElementById('share-modal');
      document.getElementById('share-mix-img').src = mixUrl;
      document.getElementById('secret-input').value = '';
      document.getElementById('from-input').value = 'от вселенной';

      // Циклическая смена языка
      let langIndex = 0;
      const labelEl = document.getElementById('secret-label');
      const interval = setInterval(() => {
        labelEl.textContent = secretMessages[langIndex];
        langIndex = (langIndex + 1) % secretMessages.length;
      }, 800);
      modal._langInterval = interval;

      modal.style.display = 'flex';
    }

    document.querySelector('.modal-close[data-target="share-modal"]').addEventListener('click', () => {
      const modal = document.getElementById('share-modal');
      clearInterval(modal._langInterval);
      modal.style.display = 'none';
    });

    document.getElementById('share-send').addEventListener('click', async () => {
      const mixUrl = document.getElementById('share-mix-img').src;
      const secret = document.getElementById('secret-input').value.trim() || '...';
      const from = document.getElementById('from-input').value.trim() || 'от вселенной';

      // Формируем URL
      const shareParams = new URLSearchParams({
        mix: mixUrl,
        secret: secret,
        from: from
      });
      const fullUrl = `${window.location.origin}${window.location.pathname}?${shareParams.toString()}`;

      // Попытка Web Share
      try {
        if (navigator.share) {
          await navigator.share({
            title: `Сообщение ${from}`,
            text: secret,
            url: fullUrl
          });
        } else {
          // Fallback: копирование ссылки
          await navigator.clipboard.writeText(fullUrl);
          alert('Ссылка скопирована! Вставьте её в соцсеть.');
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          await navigator.clipboard.writeText(fullUrl);
          alert('Ссылка скопирована!');
        }
      }

      document.getElementById('share-modal').style.display = 'none';
    });

    // === Обновлённая функция addSticker ===
    function addSticker(url) {
      addStickerFromUrl(url, true);
    }

    function attachLikeLogic(likeBtn, url) {
      const isUserLiked = myLikedMixes.some(m => m.url === url);
      const isShared = sharedLikedMixes.includes(url);
      updateLikeIcon(likeBtn, isUserLiked, isShared);

      likeBtn.addEventListener('click', () => {
        const wasUserLiked = myLikedMixes.some(m => m.url === url);
        const wasBotLiked = likeBtn.dataset.botLiked === 'true';

        if (wasUserLiked) {
          myLikedMixes = myLikedMixes.filter(m => m.url !== url);
          if (sharedLikedMixes.includes(url)) {
            sharedLikedMixes = sharedLikedMixes.filter(u => u !== url);
          }
        } else {
          myLikedMixes.push({ url, timestamp: Date.now() });
          if (wasBotLiked && !sharedLikedMixes.includes(url)) {
            sharedLikedMixes.push(url);
          }
        }

        localStorage.setItem('myLikedMixes', JSON.stringify(myLikedMixes));
        localStorage.setItem('sharedLikedMixes', JSON.stringify(sharedLikedMixes));
        updateCounters();
        updateLikeIcon(likeBtn, !wasUserLiked, sharedLikedMixes.includes(url));
        resetInactivityTimer();

        if (!wasUserLiked && !wasBotLiked && interlocutorActive && recentMixUrls.includes(url)) {
          if (Math.random() < REACT_LIKE_CHANCE) {
            setTimeout(() => {
              if (!interlocutorActive) return;
              likeBtn.dataset.botLiked = 'true';
              const nowShared = true;
              if (!sharedLikedMixes.includes(url)) {
                sharedLikedMixes.push(url);
                localStorage.setItem('sharedLikedMixes', JSON.stringify(sharedLikedMixes));
                updateCounters();
              }
              updateLikeIcon(likeBtn, true, nowShared);
            }, 1000 + Math.random() * 2000);
          }
        }
      });

      // Bot like logic
      if (currentBotPersonality && Math.random() < currentBotPersonality.likeChance) {
        setTimeout(() => {
          if (!interlocutorActive) return;
          const wasUserLiked = myLikedMixes.some(m => m.url === url);
          const alreadyBotLiked = likeBtn.dataset.botLiked === 'true';

          if (!alreadyBotLiked) {
            likeBtn.dataset.botLiked = 'true';
            const nowShared = wasUserLiked;
            if (nowShared && !sharedLikedMixes.includes(url)) {
              sharedLikedMixes.push(url);
              localStorage.setItem('sharedLikedMixes', JSON.stringify(sharedLikedMixes));
              updateCounters();
            }
            updateLikeIcon(likeBtn, wasUserLiked, nowShared);
          }
        }, 2000 + Math.random() * 2000);
      }
    }

    function updateLikeIcon(btn, userLiked, isShared) {
      if (isShared) {
        btn.textContent = '💞';
      } else if (userLiked) {
        btn.textContent = '❤️';
      } else if (btn.dataset.botLiked === 'true') {
        btn.textContent = '❤️';
      } else {
        btn.textContent = '♡';
      }
    }

    // === Остальной код без изменений, но с обновлённой addSticker ===
    const script = document.createElement('script');
    script.src = 'https://git.emoji.supply/kitchen/emojidata.js';
    script.onload = () => {
      handleIncomingShare(); // сначала проверим share
      if (!new URLSearchParams(window.location.search).has('mix')) {
        initApp(); // иначе обычный старт
      }
    };
    document.head.appendChild(script);

    const codePointToText = (codePoint) =>
      String.fromCodePoint(...codePoint.split('-').map(x => parseInt(x, 16)));

    const emojiUrl = (codePoint) => {
      let cp = codePoint.split('-').filter(x => x !== 'fe0f').map(s => s.padStart(4, '0')).join('_');
      return `https://raw.githubusercontent.com/googlefonts/noto-emoji/main/png/128/emoji_u${cp}.png`;
    };

    const mixmojiUrl = (r, c) => {
      let padZeros = r < 20220500;
      c = c.map(code => code.split('-').map(s => padZeros ? s.padStart(4, '0') : s).join('-u'));
      return `https://www.gstatic.com/android/keyboard/emojikitchen/${r}/u${c[0]}/u${c[0]}_u${c[1]}.png`;
    };

    const convertBase = (val, from, to) => {
      const chars = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ+/';
      let dec = [...val.toString()].reverse().reduce((s, d, i) => s + chars.indexOf(d) * Math.pow(from, i), 0);
      if (!dec) return '0';
      let res = '';
      while (dec) {
        res = chars[dec % to] + res;
        dec = Math.floor(dec / to);
      }
      return res;
    };

    const FRIEND_MESSAGES = [
      "🤖 Ищем пару... 🇷🇺",
      "🤖 Finding a pair... 🇬🇧",
      "🤖 正在寻找搭档…… 🇨🇳"
    ];

    const WANT_TO_PLAY_MESSAGES = [
      "🤖 Я найду, но только ты можешь ♥️ 🇷🇺",
      "🤖 I’ll find it, but only you can ♥️ 🇬🇧",
      "🤖 我会找到，但只有你能 ♥️ 🇨🇳"
    ];

    const BOT_PERSONALITIES = [
      { name: 'reserved', likeChance: 0.2 },
      { name: 'moderate', likeChance: 0.5 },
      { name: 'enthusiast', likeChance: 0.7 }
    ];
    const REACT_LIKE_CHANCE = 0.5;

    // --- DOM ---
    const chat = document.getElementById('chat');
    const choiceArea = document.getElementById('choice-area');
    const emojiCanvas = document.getElementById('emoji-canvas');
    const scannerOverlay = document.getElementById('scanner-overlay');
    const dynamicScanner = document.getElementById('dynamic-scanner');
    const theirAvatar = document.getElementById('their-avatar');
    const myAvatar = document.getElementById('my-avatar');
    const myLikesEl = document.getElementById('my-likes');
    const sharedLikesEl = document.getElementById('shared-likes');
    const myLikesGrid = document.getElementById('my-likes-grid');
    const sharedLikesGrid = document.getElementById('shared-likes-grid');
    const refreshBtn = document.getElementById('refresh-btn');

    // --- Состояния прокрутки ---
    let useVirtualScroll = true;
    let hasSwitchedToNative = false;
    let virtualScrollOffset = 0;
    let autoScrollRaf = null;

    // --- Остальные состояния ---
    let currentBaseEmoji = null;
    let currentGameIndex = 0;
    let turnsInCurrentGame = 0;
    let maxTurnsForCurrentGame = 0;
    let interlocutorActive = false;
    let lastBotMessageTime = 0;
    let myFirstMixUrl = null;
    let lastUserEmojiId = null;
    let currentBotPersonality = null;
    let botAssistantActive = false;
    let inactivityTimer = null;
    let autoSelectTimer = null;
    let userInteracted = false;
    let manualScrollTimer = null;

    const INACTIVITY_TIMEOUT = 5000;
    const AUTO_SELECT_DELAY = 4000;
    const RESUME_SCROLL_DELAY = 1500;
    const SCROLL_SPEED = 0.5;

    let recentMixUrls = [];
    let myLikedMixes = JSON.parse(localStorage.getItem('myLikedMixes') || '[]');
    let sharedLikedMixes = JSON.parse(localStorage.getItem('sharedLikedMixes') || '[]');

    function updateCounters() {
      myLikesEl.textContent = `❤️ ${myLikedMixes.length}`;
      sharedLikesEl.textContent = `💞 ${sharedLikedMixes.length}`;
    }
    updateCounters();

    // --- Модалки (без изменений) ---
    document.querySelectorAll('.modal-close').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.target;
        document.getElementById(target).style.display = 'none';
      });
    });

    myLikesEl.addEventListener('click', () => {
      myLikesGrid.innerHTML = '';
      myLikedMixes.slice().reverse().forEach(item => {
        const div = document.createElement('div');
        div.className = 'collection-item';
        div.innerHTML = `<img src="${item.url}" onerror="this.style.display='none'">`;
        myLikesGrid.appendChild(div);
      });
      document.getElementById('my-likes-modal').style.display = 'flex';
    });

    sharedLikesEl.addEventListener('click', () => {
      sharedLikesGrid.innerHTML = '';
      sharedLikedMixes.slice().reverse().forEach(url => {
        const div = document.createElement('div');
        div.className = 'collection-item';
        div.innerHTML = `<img src="${url}" onerror="this.style.display='none'">`;
        sharedLikesGrid.appendChild(div);
      });
      document.getElementById('shared-likes-modal').style.display = 'flex';
    });

    // --- Сканер (без изменений) ---
    function showScanner() {
      const rect = choiceArea.getBoundingClientRect();
      const top = rect.top + window.scrollY;
      const height = rect.height;
      const left = rect.left;
      const width = rect.width;

      dynamicScanner.style.width = width + 'px';
      dynamicScanner.style.left = left + 'px';
      dynamicScanner.style.top = top + 'px';
      dynamicScanner.style.setProperty('--start-top', top + 'px');
      dynamicScanner.style.setProperty('--end-top', (top + height) + 'px');

      dynamicScanner.style.transform = 'scaleX(0)';
      dynamicScanner.style.opacity = '1';
      dynamicScanner.classList.remove('scanning');
      scannerOverlay.style.display = 'block';

      setTimeout(() => {
        dynamicScanner.style.transition = 'transform 1s ease-out';
        dynamicScanner.style.transform = 'scaleX(1)';
      }, 50);

      setTimeout(() => {
        dynamicScanner.classList.add('scanning');
        dynamicScanner.style.transition = 'none';
      }, 1050);
    }

    function hideScanner() {
      scannerOverlay.style.display = 'none';
      dynamicScanner.classList.remove('scanning');
    }

    // --- Сообщения ---
    function addMessage(codePoint, sender = 'player2') {
      const el = document.createElement('div');
      el.className = `message ${sender}`;
      const img = document.createElement('img');
      img.src = emojiUrl(codePoint);
      img.style.width = '60px';
      img.style.height = '60px';
      img.style.verticalAlign = 'middle';
      img.onerror = () => { img.style.display = 'none'; };
      el.appendChild(img);
      chat.appendChild(el);
      requestAnimationFrame(() => chat.scrollTop = chat.scrollHeight);
      if (sender === 'player2') lastBotMessageTime = Date.now();
      resetInactivityTimer();
    }

    function addSystemMessage(text) {
      const el = document.createElement('div');
      el.className = 'message system';
      el.textContent = text;
      chat.appendChild(el);
      requestAnimationFrame(() => chat.scrollTop = chat.scrollHeight);
    }

    // --- Логика игры (остальное без изменений) ---
    function getCompat(baseId) {
      const idx = window.points.indexOf(baseId);
      if (idx === -1) return [];
      const b64 = convertBase(idx.toString(), 10, 64);
      const re = new RegExp(`^.*\\.${b64}\\..*$`, 'gm');
      const matches = [...window.pairs.matchAll(re)];
      const set = new Set();
      for (const m of matches) {
        const [_, a, b] = m[0].split('.');
        const i1 = convertBase(a, 64, 10), i2 = convertBase(b, 64, 10);
        if (window.points[i1] === baseId) set.add(window.points[i2]);
        if (window.points[i2] === baseId) set.add(window.points[i1]);
      }
      return [...set];
    }

    function getMaxTurnsForGame(gameIndex) {
      if (gameIndex <= 3) return Math.floor(Math.random() * 6) + 5;
      if (gameIndex <= 6) return Math.floor(Math.random() * 21) + 10;
      return Math.floor(Math.random() * 91) + 10;
    }

    function getRandomMixUrl() {
      const a = window.points[Math.floor(Math.random() * window.points.length)];
      const compat = getCompat(a);
      if (!compat.length) return null;
      const b = compat[Math.floor(Math.random() * compat.length)];
      const i1 = window.points.indexOf(a), i2 = window.points.indexOf(b);
      if (i1 === -1 || i2 === -1) return null;
      const b1 = convertBase(i1, 10, 64), b2 = convertBase(i2, 10, 64);
      const pat1 = new RegExp(`^(\\w+)\\.${b1}\\.${b2}`, 'm');
      const pat2 = new RegExp(`^(\\w+)\\.${b2}\\.${b1}`, 'm');
      const match = window.pairs.match(pat1) || window.pairs.match(pat2);
      if (!match) return null;
      const revPart = match[0].split('.')[0];
      const rev = window.revisions[convertBase(revPart, 64, 10)];
      const order = window.pairs.match(pat2) ? [b, a] : [a, b];
      return mixmojiUrl(rev, order);
    }

    function switchToNativeScroll() {
      if (!useVirtualScroll || hasSwitchedToNative) return;
      useVirtualScroll = false;
      hasSwitchedToNative = true;
      cancelAnimationFrame(autoScrollRaf);
      autoScrollRaf = null;
      emojiCanvas.style.transform = 'none';
      emojiCanvas.classList.remove('virtual-scroll');
      const containerHeight = choiceArea.clientHeight;
      const contentHeight = emojiCanvas.scrollHeight;
      const maxContentOffset = Math.max(0, contentHeight - containerHeight);
      const virtualRatio = virtualScrollOffset / (emojiCanvas.offsetHeight || 1);
      const targetScrollTop = virtualRatio * maxContentOffset;
      choiceArea.scrollTop = Math.min(maxContentOffset, targetScrollTop);
    }

    function autoScrollStep() {
      if (!interlocutorActive || userInteracted || !useVirtualScroll) return;
      virtualScrollOffset += SCROLL_SPEED;
      emojiCanvas.style.transform = `translateY(${-virtualScrollOffset}px)`;
      autoScrollRaf = requestAnimationFrame(autoScrollStep);
    }

    function startAutoScroll() {
      if (!useVirtualScroll) return;
      cancelAnimationFrame(autoScrollRaf);
      autoScrollRaf = requestAnimationFrame(autoScrollStep);
    }

    function stopAutoScroll() {
      if (autoScrollRaf) {
        cancelAnimationFrame(autoScrollRaf);
        autoScrollRaf = null;
      }
    }

    function resetCanvas() {
      emojiCanvas.innerHTML = '';
      virtualScrollOffset = 0;
      useVirtualScroll = true;
      hasSwitchedToNative = false;
      emojiCanvas.classList.add('virtual-scroll');
      choiceArea.scrollTop = 0;
    }

    function showChoices() {
      const compat = getCompat(currentBaseEmoji);
      if (!compat.length) {
        switchToNewInterlocutor();
        return;
      }

      userInteracted = false;
      emojiCanvas.classList.remove('disabled-all');
      resetCanvas();

      const shuffled = [...compat].sort(() => 0.5 - Math.random());
      const duplicated = [...shuffled, ...shuffled];

      duplicated.forEach(id => {
        const btn = document.createElement('div');
        btn.className = 'choice-btn';
        btn.dataset.id = id;
        const img = document.createElement('img');
        img.src = emojiUrl(id);
        img.onerror = () => { img.style.opacity = '0.3'; };
        btn.appendChild(img);
        btn.onclick = () => handleUserChoice(id);
        emojiCanvas.appendChild(btn);
      });

      startAutoScroll();
      resetInactivityTimer();
    }

    function handleUserChoice(selectedId) {
      if (botAssistantActive) deactivateBotAssistant();
      emojiCanvas.classList.add('disabled-all');
      lastUserEmojiId = selectedId;
      addMessage(selectedId, 'player1');

      setTimeout(() => {
        showMix(currentBaseEmoji, selectedId, (mixUrl) => {
          if (!myFirstMixUrl) myFirstMixUrl = mixUrl;
          myAvatar.src = myFirstMixUrl;

          turnsInCurrentGame++;
          if (turnsInCurrentGame >= maxTurnsForCurrentGame) {
            switchToNewInterlocutor();
            return;
          }
          setTimeout(botRespond, Math.random() * 1000);
        });
      }, 600);
    }

    function showMix(a, b, cb) {
      const i1 = window.points.indexOf(a), i2 = window.points.indexOf(b);
      if (i1 === -1 || i2 === -1) return cb(null);

      const b1 = convertBase(i1, 10, 64), b2 = convertBase(i2, 10, 64);
      const pat1 = new RegExp(`^(\\w+)\\.${b1}\\.${b2}`, 'm');
      const pat2 = new RegExp(`^(\\w+)\\.${b2}\\.${b1}`, 'm');
      const match = window.pairs.match(pat1) || window.pairs.match(pat2);
      if (!match) return cb(null);

      const revPart = match[0].split('.')[0];
      const rev = window.revisions[convertBase(revPart, 64, 10)];
      const order = window.pairs.match(pat2) ? [b, a] : [a, b];
      const url = mixmojiUrl(rev, order);

      addSticker(url);
      currentBaseEmoji = b;
      setTimeout(() => cb(url), 1200);
    }

    function botRespond() {
      if (!interlocutorActive) return;
      const compat = getCompat(currentBaseEmoji);
      if (!compat.length) {
        switchToNewInterlocutor();
        return;
      }
      const choice = compat[Math.floor(Math.random() * compat.length)];
      addMessage(choice, 'player2');
      setTimeout(() => {
        showMix(currentBaseEmoji, choice, () => {
          showChoices();
        });
      }, 1200);
    }

    function showMultilingualMessage(messages, onComplete) {
      const systemDiv = document.createElement('div');
      systemDiv.className = 'message system fade';
      chat.appendChild(systemDiv);
      requestAnimationFrame(() => chat.scrollTop = chat.scrollHeight);

      let index = 0;
      const update = () => {
        systemDiv.textContent = messages[index];
        systemDiv.classList.remove('out');
        index = (index + 1) % messages.length;
      };

      update();
      const interval = setInterval(() => {
        systemDiv.classList.add('out');
        setTimeout(() => {
          if (index < messages.length) {
            update();
          } else {
            clearInterval(interval);
            onComplete();
          }
        }, 400);
      }, 1000);

      setTimeout(() => {
        clearInterval(interval);
        onComplete();
      }, 3000);
    }

    function showMultilingualSearchMessage(onComplete) {
      showMultilingualMessage(FRIEND_MESSAGES, onComplete);
    }

    function switchToNewInterlocutor() {
      interlocutorActive = false;
      recentMixUrls = [];
      resetCanvas();

      showMultilingualSearchMessage(() => {
        setTimeout(() => {
          currentGameIndex++;
          turnsInCurrentGame = 0;
          maxTurnsForCurrentGame = getMaxTurnsForGame(currentGameIndex);
          launchNewInterlocutor();
        }, 1500);
      });
    }

    function launchNewInterlocutor() {
      currentBotPersonality = BOT_PERSONALITIES[Math.floor(Math.random() * BOT_PERSONALITIES.length)];
      let avatarUrl = getRandomMixUrl();
      if (!avatarUrl) avatarUrl = 'image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"%3E%3Ccircle cx="30" cy="30" r="28" fill="%23ccc"/%3E%3C/svg%3E';
      theirAvatar.src = avatarUrl;

      currentBaseEmoji = window.points[Math.floor(Math.random() * window.points.length)];
      interlocutorActive = true;
      addMessage(currentBaseEmoji, 'player2');
      showChoices();
    }

    function onManualInteraction() {
      if (useVirtualScroll) {
        switchToNativeScroll();
      }
      resetInactivityTimer();
    }

    choiceArea.addEventListener('wheel', onManualInteraction, { passive: true });
    choiceArea.addEventListener('touchstart', onManualInteraction, { passive: true });
    choiceArea.addEventListener('pointerdown', onManualInteraction);

    refreshBtn.addEventListener('click', () => {
      if (interlocutorActive) {
        switchToNewInterlocutor();
      }
    });

    function activateBotAssistant() {
      if (!interlocutorActive || userInteracted) return;

      showMultilingualMessage(WANT_TO_PLAY_MESSAGES, () => {
        botAssistantActive = true;
        myAvatar.src = "image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Ctext x='30' y='40' font-size='32' text-anchor='middle' fill='%23000'%3E🤖%3C/text%3E%3C/svg%3E";
        showScanner();
        autoSelectTimer = setTimeout(() => {
          if (botAssistantActive && interlocutorActive) {
            const compat = getCompat(currentBaseEmoji);
            if (compat.length) {
              const autoChoice = compat[Math.floor(Math.random() * compat.length)];
              handleUserChoice(autoChoice);
            }
          }
        }, AUTO_SELECT_DELAY);
      });
    }

    function deactivateBotAssistant() {
      botAssistantActive = false;
      hideScanner();
      if (myFirstMixUrl) {
        myAvatar.src = myFirstMixUrl;
      } else {
        myAvatar.src = "image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Ccircle cx='30' cy='30' r='28' fill='%23007bff'/%3E%3C/svg%3E";
      }
    }

    function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      clearTimeout(autoSelectTimer);
      if (botAssistantActive) deactivateBotAssistant();
      inactivityTimer = setTimeout(activateBotAssistant, INACTIVITY_TIMEOUT);
    }

    function initApp() {
      showMultilingualSearchMessage(() => {
        setTimeout(() => {
          currentGameIndex = 1;
          turnsInCurrentGame = 0;
          maxTurnsForCurrentGame = getMaxTurnsForGame(currentGameIndex);
          launchNewInterlocutor();
        }, 1500);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      resetInactivityTimer();
    });
  </script>
</body>
</html>
