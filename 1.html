<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoji Chat — Natural & Context-Aware Bots</title>
  <!-- OG мета (динамические) -->
  <meta property="og:title" content="Сообщение от вселенной 🌌" id="og-title" />
  <meta property="og:description" content="Тебе пришло секретное сообщение..." id="og-desc" />
  <meta property="og:image" content="https://your-github.io/emoji-chat/fallback.jpg" id="og-image" />
  <meta property="og:url" content="" id="og-url" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
    body {
      background: #f0f0f0;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #e0e0e0;
      position: relative;
    }
    #likes-display {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      display: flex;
      gap: 12px;
      user-select: none;
    }
    .likes-counter {
      cursor: pointer;
    }
    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: cover;
      image-rendering: -webkit-optimize-contrast;
    }
    #refresh-btn {
      width: 24px;
      height: 24px;
      margin-left: 8px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    #refresh-btn:hover {
      opacity: 1;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 12px;
    }
    .message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.4;
      position: relative;
    }
    .system {
      align-self: center;
      background: #e0e0e0;
      color: #555;
      font-size: 0.9em;
      border-radius: 12px;
      text-align: center;
      padding: 6px 12px;
    }
    .sticker-container {
      margin: 8px auto;
      text-align: center;
      position: relative;
    }
    .sticker-img {
      height: 100px;
      image-rendering: -webkit-optimize-contrast;
    }
    .action-bar {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
      padding: 0 8px;
    }
    .action-btn {
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }

    .player1 { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 4px; }
    .player2 { align-self: flex-start; background: white; border-bottom-left-radius: 4px; }

    #choice-area {
      height: 35vh;
      padding: 0 16px 16px;
      background: white;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      position: relative;
      border-top: 1px solid #ddd;
      scroll-behavior: auto;
    }

    .emoji-canvas {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }

    .emoji-canvas.virtual-scroll {
      transition: transform 0.1s linear;
    }

    .emoji-canvas.disabled-all .choice-btn {
      opacity: 0.4;
      pointer-events: none;
    }

    .choice-btn {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .choice-btn:hover { transform: scale(1.2); }
    .choice-btn img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
    }

    /* Scanner overlay */
    #scanner-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2000;
      display: none;
    }

    .scanner-line {
      position: absolute;
      height: 3px;
      background: cyan;
      box-shadow: 0 0 8px cyan, 0 0 16px cyan;
      transform-origin: center;
      transform: scaleX(0);
      opacity: 1;
    }

    @keyframes glitch-scan {
      0%, 100% { opacity: 1; text-shadow: 0 0 5px cyan; transform: translateX(0); }
      92% { opacity: 0.3; text-shadow: 2px 0 5px red, -2px 0 8px cyan; transform: translateX(2px); }
      95% { opacity: 1; text-shadow: 0 0 5px cyan; transform: translateX(-2px); }
      97% { opacity: 0.5; text-shadow: -2px 0 8px red, 2px 0 5px cyan; transform: translateX(1px); }
    }

    .scanner-line.scanning {
      animation: scan-down 4s linear forwards, glitch-scan 0.15s infinite;
    }

    @keyframes scan-down {
      0% { top: var(--start-top); opacity: 1; }
      95% { opacity: 1; }
      100% { top: var(--end-top); opacity: 0; }
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .modal-close {
      float: right;
      cursor: pointer;
      font-size: 20px;
      margin-bottom: 8px;
    }
    #share-mix-preview {
      height: 120px;
      margin: 12px 0;
      image-rendering: -webkit-optimize-contrast;
    }
    #share-secret, #share-from {
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      min-height: 24px;
      font-size: 16px;
    }

    .fade { opacity: 1; transition: opacity 0.4s ease; }
    .fade.out { opacity: 0; }
  </style>
</head>
<body>
  <div id="status-bar">
    <div style="display: flex; align-items: center;">
      <img id="their-avatar" class="avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Ccircle cx='30' cy='30' r='28' fill='%23ccc'/%3E%3C/svg%3E" />
      <div id="refresh-btn" title="Найти нового собеседника">🔄</div>
    </div>
    <div id="likes-display">
      <div id="my-likes" class="likes-counter">❤️ 0</div>
      <div id="shared-likes" class="likes-counter">💞 0</div>
    </div>
    <img id="my-avatar" class="avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Ccircle cx='30' cy='30' r='28' fill='%23007bff'/%3E%3C/svg%3E" />
  </div>
  <div id="chat"></div>
  <div id="choice-area">
    <div class="emoji-canvas virtual-scroll" id="emoji-canvas"></div>
  </div>

  <div id="scanner-overlay">
    <div class="scanner-line" id="dynamic-scanner"></div>
  </div>

  <!-- Share Modal -->
  <div id="share-modal" class="modal">
    <div class="modal-content">
      <div class="modal-close" data-target="share-modal">✕</div>
      <h3>Поделиться миксом</h3>
      <img id="share-mix-preview" src="" />
      <div id="share-secret" data-ru="Здесь секретное сообщение" data-en="Here is a secret message" data-cn="此处有秘密消息"></div>
      <div id="share-from" data-ru="от вселенной" data-en="from the universe" data-cn="来自宇宙"></div>
      <div style="margin-top: 16px; cursor: pointer;" id="share-send-btn">✈️ Отправить</div>
    </div>
  </div>

  <script>
    // === ПОЛНАЯ РЕАЛИЗАЦИЯ СИСТЕМНОГО ШЕРИНГА ===

    const script = document.createElement('script');
    script.src = 'https://git.emoji.supply/kitchen/emojidata.js';
    script.onload = initApp;
    document.head.appendChild(script);

    // --- Утилиты ---
    const b64url = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const unb64url = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '=='.slice((s.length % 4) || 4))));

    const emojiUrl = (codePoint) => {
      let cp = codePoint.split('-').filter(x => x !== 'fe0f').map(s => s.padStart(4, '0')).join('_');
      return `https://raw.githubusercontent.com/googlefonts/noto-emoji/main/png/128/emoji_u${cp}.png`;
    };

    const mixmojiUrl = (r, c) => {
      let padZeros = r < 20220500;
      c = c.map(code => code.split('-').map(s => padZeros ? s.padStart(4, '0') : s).join('-u'));
      return `https://www.gstatic.com/android/keyboard/emojikitchen/${r}/u${c[0]}/u${c[0]}_u${c[1]}.png`;
    };

    const convertBase = (val, from, to) => {
      const chars = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ+/';
      let dec = [...val.toString()].reverse().reduce((s, d, i) => s + chars.indexOf(d) * Math.pow(from, i), 0);
      if (!dec) return '0';
      let res = '';
      while (dec) {
        res = chars[dec % to] + res;
        dec = Math.floor(dec / to);
      }
      return res;
    };

    // --- МОДАЛЬНЫЕ СООБЩЕНИЯ ---
    const FRIEND_MESSAGES = [
      "🤖 Ищем пару... 🇷🇺",
      "🤖 Finding a pair... 🇬🇧",
      "🤖 正在寻找搭档…… 🇨🇳"
    ];

    const WANT_TO_PLAY_MESSAGES = [
      "🤖 Я найду, но только ты можешь ♥️ 🇷🇺",
      "🤖 I’ll find it, but only you can ♥️ 🇬🇧",
      "🤖 我会找到，但只有你能 ♥️ 🇨🇳"
    ];

    const SECRET_MESSAGES = [
      "Здесь секретное сообщение",
      "Here is a secret message",
      "此处有秘密消息"
    ];

    const FROM_MESSAGES = [
      "от вселенной",
      "from the universe",
      "来自宇宙"
    ];

    // --- DOM ---
    const chat = document.getElementById('chat');
    const choiceArea = document.getElementById('choice-area');
    const emojiCanvas = document.getElementById('emoji-canvas');
    const scannerOverlay = document.getElementById('scanner-overlay');
    const dynamicScanner = document.getElementById('dynamic-scanner');
    const theirAvatar = document.getElementById('their-avatar');
    const myAvatar = document.getElementById('my-avatar');
    const myLikesEl = document.getElementById('my-likes');
    const sharedLikesEl = document.getElementById('shared-likes');
    const myLikesGrid = document.getElementById('my-likes-grid');
    const sharedLikesGrid = document.getElementById('shared-likes-grid');
    const refreshBtn = document.getElementById('refresh-btn');

    // Share modal
    const shareModal = document.getElementById('share-modal');
    const shareMixPreview = document.getElementById('share-mix-preview');
    const shareSecretEl = document.getElementById('share-secret');
    const shareFromEl = document.getElementById('share-from');
    const shareSendBtn = document.getElementById('share-send-btn');

    // OG tags
    const ogTitle = document.getElementById('og-title');
    const ogDesc = document.getElementById('og-desc');
    const ogImage = document.getElementById('og-image');
    const ogUrl = document.getElementById('og-url');
    ogUrl.content = window.location.href;

    // --- Состояния ---
    let currentBaseEmoji = null;
    let currentGameIndex = 0;
    let turnsInCurrentGame = 0;
    let maxTurnsForCurrentGame = 0;
    let interlocutorActive = false;
    let lastBotMessageTime = 0;
    let myFirstMixUrl = null;
    let lastUserEmojiId = null;
    let currentBotPersonality = null;
    let botAssistantActive = false;
    let inactivityTimer = null;
    let autoSelectTimer = null;
    let userInteracted = false;
    let manualScrollTimer = null;
    let useVirtualScroll = true;
    let hasSwitchedToNative = false;
    let virtualScrollOffset = 0;
    let autoScrollRaf = null;
    let pendingShareUrl = null;
    let pendingShareFrom = null;

    const INACTIVITY_TIMEOUT = 5000;
    const AUTO_SELECT_DELAY = 4000;
    const RESUME_SCROLL_DELAY = 1500;
    const SCROLL_SPEED = 0.5;

    let recentMixUrls = [];
    let myLikedMixes = JSON.parse(localStorage.getItem('myLikedMixes') || '[]');
    let sharedLikedMixes = JSON.parse(localStorage.getItem('sharedLikedMixes') || '[]');

    // --- Обновление OG ---
    function updateOG(mixUrl, secret = 'Секретное сообщение', from = 'от вселенной') {
      ogTitle.content = `Сообщение ${from} 🌌`;
      ogDesc.content = secret;
      ogImage.content = mixUrl;
      ogUrl.content = window.location.href;
    }

    // --- Обработка входящей ссылки ---
    function handleIncomingShare() {
      const urlParams = new URLSearchParams(window.location.search);
      const mixParam = urlParams.get('mix');
      const msgParam = urlParams.get('msg');
      const fromParam = urlParams.get('from');

      if (!mixParam) return;

      try {
        const [a, b] = mixParam.split('-');
        const i1 = window.points.indexOf(a), i2 = window.points.indexOf(b);
        if (i1 === -1 || i2 === -1) throw 'invalid mix';

        const b1 = convertBase(i1, 10, 64), b2 = convertBase(i2, 10, 64);
        const pat1 = new RegExp(`^(\\w+)\\.${b1}\\.${b2}`, 'm');
        const pat2 = new RegExp(`^(\\w+)\\.${b2}\\.${b1}`, 'm');
        const match = window.pairs.match(pat1) || window.pairs.match(pat2);
        if (!match) throw 'no revision';

        const revPart = match[0].split('.')[0];
        const rev = window.revisions[convertBase(revPart, 64, 10)];
        const order = window.pairs.match(pat2) ? [b, a] : [a, b];
        const mixUrl = mixmojiUrl(rev, order);

        const secret = msgParam ? unb64url(msgParam) : 'Секретное сообщение';
        const from = fromParam ? unb64url(fromParam) : 'от вселенной';

        // Показываем в чате
        const systemMsg = document.createElement('div');
        systemMsg.className = 'message system';
        systemMsg.textContent = `${secret} (${from})`;
        chat.appendChild(systemMsg);

        addStickerFromUrl(mixUrl, secret, from);

        // Начинаем игру
        setTimeout(() => {
          currentBaseEmoji = b;
          interlocutorActive = true;
          addMessage(currentBaseEmoji, 'player2');
          showChoices();
        }, 1000);

        updateOG(mixUrl, secret, from);
      } catch (e) {
        console.warn('Invalid share link', e);
      }
    }

    // --- Share Modal ---
    function showShareModal(mixUrl) {
      shareMixPreview.src = mixUrl;
      pendingShareUrl = mixUrl;

      // Цикл секретного сообщения (1 проход)
      showCycledText(shareSecretEl, SECRET_MESSAGES, () => {
        // Цикл "от вселенной"
        showCycledText(shareFromEl, FROM_MESSAGES, () => {
          // Готово
        });
      });

      shareModal.style.display = 'flex';
    }

    function showCycledText(el, messages, onComplete) {
      let index = 0;
      const update = () => {
        el.textContent = messages[index];
        el.classList.remove('out');
        index++;
      };

      update();
      const interval = setInterval(() => {
        if (index >= messages.length) {
          clearInterval(interval);
          onComplete();
          return;
        }
        el.classList.add('out');
        setTimeout(update, 400);
      }, 1000);
    }

    shareSendBtn.addEventListener('click', async () => {
      const secret = shareSecretEl.textContent;
      const from = shareFromEl.textContent;
      const mixUrl = pendingShareUrl;

      const mixCode = mixUrl.match(/u([a-f0-9_-]+)_u([a-f0-9_-]+)/);
      if (!mixCode) return;

      const a = mixCode[1].replace(/_/g, '-');
      const b = mixCode[2].replace(/_/g, '-');
      const mixParam = `${a}-${b}`;
      const msgParam = b64url(secret);
      const fromParam = b64url(from);

      const shareUrl = `${window.location.origin}${window.location.pathname}?mix=${mixParam}&msg=${msgParam}&from=${fromParam}`;

      // Обновляем OG
      updateOG(mixUrl, secret, from);

      // Пытаемся сгенерировать картинку
      let imageUrl = mixUrl;
      try {
        const imgBlobUrl = await generateShareImage(mixUrl, secret, from);
        if (imgBlobUrl) {
          imageUrl = imgBlobUrl;
          ogImage.content = imageUrl;
        }
      } catch (e) {
        console.warn('Image gen failed, using fallback', e);
      }

      // Web Share или копирование
      if (navigator.share) {
        try {
          await navigator.share({
            title: `Сообщение ${from}`,
            text: secret,
            url: shareUrl
          });
        } catch (err) {
          if (err.name !== 'AbortError') {
            await copyToClipboard(shareUrl);
            alert('Ссылка скопирована!');
          }
        }
      } else {
        await copyToClipboard(shareUrl);
        alert('Ссылка скопирована!');
      }

      shareModal.style.display = 'none';
    });

    document.querySelector('.modal-close[data-target="share-modal"]').addEventListener('click', () => {
      shareModal.style.display = 'none';
    });

    async function copyToClipboard(text) {
      if (navigator.clipboard) {
        await navigator.clipboard.writeText(text);
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      }
    }

    async function generateShareImage(mixUrl, secret, from) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 512;
          canvas.height = 512;
          const ctx = canvas.getContext('2d');

          // Фон
          ctx.fillStyle = '#f0f0f0';
          ctx.fillRect(0, 0, 512, 512);

          // Микс по центру
          ctx.drawImage(img, 156, 156, 200, 200);

          // Текст
          ctx.fillStyle = '#333';
          ctx.font = '24px system-ui';
          ctx.textAlign = 'center';
          ctx.fillText(secret, 256, 100);
          ctx.fillText(from, 256, 450);

          canvas.toBlob(blob => {
            const url = URL.createObjectURL(blob);
            resolve(url);
          }, 'image/png');
        };
        img.onerror = () => resolve(null);
        img.src = mixUrl;
      });
    }

    function addStickerFromUrl(url, secret, from) {
      const container = document.createElement('div');
      container.className = 'message system sticker-container';
      const img = document.createElement('img');
      img.className = 'sticker-img';
      img.src = url;
      img.onerror = () => img.style.display = 'none';
      container.appendChild(img);

      const actionBar = document.createElement('div');
      actionBar.className = 'action-bar';
      const likeBtn = document.createElement('div');
      likeBtn.className = 'action-btn';
      likeBtn.textContent = '♡';
      likeBtn.dataset.url = url;
      likeBtn.dataset.botLiked = 'false';
      likeBtn.addEventListener('click', () => {
        // упрощённо — можно расширить
        likeBtn.textContent = likeBtn.textContent === '♡' ? '❤️' : '♡';
      });
      const shareBtn = document.createElement('div');
      shareBtn.className = 'action-btn';
      shareBtn.textContent = '✈️';
      shareBtn.onclick = () => showShareModal(url);
      actionBar.appendChild(likeBtn);
      actionBar.appendChild(shareBtn);
      container.appendChild(actionBar);

      chat.appendChild(container);
      requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
    }

    // --- Остальной код (без изменений, кроме addSticker) ---
    // ... (все функции: updateCounters, showScanner, addMessage и т.д.)

    function updateCounters() {
      myLikesEl.textContent = `❤️ ${myLikedMixes.length}`;
      sharedLikesEl.textContent = `💞 ${sharedLikedMixes.length}`;
    }

    function showScanner() {
      const rect = choiceArea.getBoundingClientRect();
      const top = rect.top + window.scrollY;
      const height = rect.height;
      const left = rect.left;
      const width = rect.width;

      dynamicScanner.style.width = width + 'px';
      dynamicScanner.style.left = left + 'px';
      dynamicScanner.style.top = top + 'px';
      dynamicScanner.style.setProperty('--start-top', top + 'px');
      dynamicScanner.style.setProperty('--end-top', (top + height) + 'px');

      dynamicScanner.style.transform = 'scaleX(0)';
      dynamicScanner.style.opacity = '1';
      dynamicScanner.classList.remove('scanning');
      scannerOverlay.style.display = 'block';

      setTimeout(() => {
        dynamicScanner.style.transition = 'transform 1s ease-out';
        dynamicScanner.style.transform = 'scaleX(1)';
      }, 50);

      setTimeout(() => {
        dynamicScanner.classList.add('scanning');
        dynamicScanner.style.transition = 'none';
      }, 1050);
    }

    function hideScanner() {
      scannerOverlay.style.display = 'none';
      dynamicScanner.classList.remove('scanning');
    }

    function addMessage(codePoint, sender = 'player2') {
      const el = document.createElement('div');
      el.className = `message ${sender}`;
      const img = document.createElement('img');
      img.src = emojiUrl(codePoint);
      img.style.width = '60px';
      img.style.height = '60px';
      img.style.verticalAlign = 'middle';
      img.onerror = () => { img.style.display = 'none'; };
      el.appendChild(img);
      chat.appendChild(el);
      requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
      if (sender === 'player2') lastBotMessageTime = Date.now();
      resetInactivityTimer();
    }

    function addSticker(url) {
      const container = document.createElement('div');
      container.className = 'message system sticker-container';

      const img = document.createElement('img');
      img.className = 'sticker-img';
      img.src = url;
      img.onerror = () => img.style.display = 'none';

      const likeBtn = document.createElement('div');
      likeBtn.className = 'action-btn';
      likeBtn.dataset.url = url;
      likeBtn.dataset.botLiked = 'false';
      likeBtn.textContent = '♡';

      const shareBtn = document.createElement('div');
      shareBtn.className = 'action-btn';
      shareBtn.textContent = '✈️';
      shareBtn.onclick = () => showShareModal(url);

      const actionBar = document.createElement('div');
      actionBar.className = 'action-bar';
      actionBar.appendChild(likeBtn);
      actionBar.appendChild(shareBtn);

      const isUserLiked = myLikedMixes.some(m => m.url === url);
      const isShared = sharedLikedMixes.includes(url);
      updateLikeIcon(likeBtn, isUserLiked, isShared);

      likeBtn.addEventListener('click', () => {
        const url = likeBtn.dataset.url;
        const wasUserLiked = myLikedMixes.some(m => m.url === url);
        const wasBotLiked = likeBtn.dataset.botLiked === 'true';

        if (wasUserLiked) {
          myLikedMixes = myLikedMixes.filter(m => m.url !== url);
          if (sharedLikedMixes.includes(url)) {
            sharedLikedMixes = sharedLikedMixes.filter(u => u !== url);
          }
        } else {
          myLikedMixes.push({ url, timestamp: Date.now() });
          if (wasBotLiked && !sharedLikedMixes.includes(url)) {
            sharedLikedMixes.push(url);
          }
        }

        localStorage.setItem('myLikedMixes', JSON.stringify(myLikedMixes));
        localStorage.setItem('sharedLikedMixes', JSON.stringify(sharedLikedMixes));
        updateCounters();
        updateLikeIcon(likeBtn, !wasUserLiked, sharedLikedMixes.includes(url));
        resetInactivityTimer();

        if (!wasUserLiked && !wasBotLiked && interlocutorActive && recentMixUrls.includes(url)) {
          if (Math.random() < 0.5) {
            setTimeout(() => {
              if (!interlocutorActive) return;
              likeBtn.dataset.botLiked = 'true';
              const nowShared = true;
              if (!sharedLikedMixes.includes(url)) {
                sharedLikedMixes.push(url);
                localStorage.setItem('sharedLikedMixes', JSON.stringify(sharedLikedMixes));
                updateCounters();
              }
              updateLikeIcon(likeBtn, true, nowShared);
            }, 1000 + Math.random() * 2000);
          }
        }
      });

      container.appendChild(img);
      container.appendChild(actionBar);
      chat.appendChild(container);
      requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });

      recentMixUrls.push(url);
      if (recentMixUrls.length > 3) recentMixUrls.shift();

      if (currentBotPersonality && Math.random() < currentBotPersonality.likeChance) {
        setTimeout(() => {
          if (!interlocutorActive) return;
          const wasUserLiked = myLikedMixes.some(m => m.url === url);
          const alreadyBotLiked = likeBtn.dataset.botLiked === 'true';

          if (!alreadyBotLiked) {
            likeBtn.dataset.botLiked = 'true';
            const nowShared = wasUserLiked;
            if (nowShared && !sharedLikedMixes.includes(url)) {
              sharedLikedMixes.push(url);
              localStorage.setItem('sharedLikedMixes', JSON.stringify(sharedLikedMixes));
              updateCounters();
            }
            updateLikeIcon(likeBtn, wasUserLiked, nowShared);
          }
        }, 2000 + Math.random() * 2000);
      }
    }

    function updateLikeIcon(btn, userLiked, isShared) {
      if (isShared) {
        btn.textContent = '💞';
      } else if (userLiked) {
        btn.textContent = '❤️';
      } else if (btn.dataset.botLiked === 'true') {
        btn.textContent = '❤️';
      } else {
        btn.textContent = '♡';
      }
    }

    // ... (остальные функции без изменений: getCompat, getMaxTurnsForGame и т.д.)

    function getCompat(baseId) {
      const idx = window.points.indexOf(baseId);
      if (idx === -1) return [];
      const b64 = convertBase(idx.toString(), 10, 64);
      const re = new RegExp(`^.*\\.${b64}\\..*$`, 'gm');
      const matches = [...window.pairs.matchAll(re)];
      const set = new Set();
      for (const m of matches) {
        const [_, a, b] = m[0].split('.');
        const i1 = convertBase(a, 64, 10), i2 = convertBase(b, 64, 10);
        if (window.points[i1] === baseId) set.add(window.points[i2]);
        if (window.points[i2] === baseId) set.add(window.points[i1]);
      }
      return [...set];
    }

    function getMaxTurnsForGame(gameIndex) {
      if (gameIndex <= 3) return Math.floor(Math.random() * 6) + 5;
      if (gameIndex <= 6) return Math.floor(Math.random() * 21) + 10;
      return Math.floor(Math.random() * 91) + 10;
    }

    function getRandomMixUrl() {
      const a = window.points[Math.floor(Math.random() * window.points.length)];
      const compat = getCompat(a);
      if (!compat.length) return null;
      const b = compat[Math.floor(Math.random() * compat.length)];
      const i1 = window.points.indexOf(a), i2 = window.points.indexOf(b);
      if (i1 === -1 || i2 === -1) return null;
      const b1 = convertBase(i1, 10, 64), b2 = convertBase(i2, 10, 64);
      const pat1 = new RegExp(`^(\\w+)\\.${b1}\\.${b2}`, 'm');
      const pat2 = new RegExp(`^(\\w+)\\.${b2}\\.${b1}`, 'm');
      const match = window.pairs.match(pat1) || window.pairs.match(pat2);
      if (!match) return null;
      const revPart = match[0].split('.')[0];
      const rev = window.revisions[convertBase(revPart, 64, 10)];
      const order = window.pairs.match(pat2) ? [b, a] : [a, b];
      return mixmojiUrl(rev, order);
    }

    // --- ГИБРИДНАЯ ПРОКРУТКА ---
    function switchToNativeScroll() {
      if (!useVirtualScroll || hasSwitchedToNative) return;
      useVirtualScroll = false;
      hasSwitchedToNative = true;
      cancelAnimationFrame(autoScrollRaf);
      autoScrollRaf = null;
      emojiCanvas.style.transform = 'none';
      emojiCanvas.classList.remove('virtual-scroll');
      const containerHeight = choiceArea.clientHeight;
      const contentHeight = emojiCanvas.scrollHeight;
      const maxContentOffset = Math.max(0, contentHeight - containerHeight);
      const virtualRatio = virtualScrollOffset / (emojiCanvas.offsetHeight || 1);
      const targetScrollTop = virtualRatio * maxContentOffset;
      choiceArea.scrollTop = Math.min(maxContentOffset, targetScrollTop);
    }

    function autoScrollStep() {
      if (!interlocutorActive || userInteracted || !useVirtualScroll) return;
      virtualScrollOffset += SCROLL_SPEED;
      emojiCanvas.style.transform = `translateY(${-virtualScrollOffset}px)`;
      autoScrollRaf = requestAnimationFrame(autoScrollStep);
    }

    function startAutoScroll() {
      if (!useVirtualScroll) return;
      cancelAnimationFrame(autoScrollRaf);
      autoScrollRaf = requestAnimationFrame(autoScrollStep);
    }

    function stopAutoScroll() {
      if (autoScrollRaf) {
        cancelAnimationFrame(autoScrollRaf);
        autoScrollRaf = null;
      }
    }

    function resetCanvas() {
      emojiCanvas.innerHTML = '';
      virtualScrollOffset = 0;
      useVirtualScroll = true;
      hasSwitchedToNative = false;
      emojiCanvas.classList.add('virtual-scroll');
      choiceArea.scrollTop = 0;
    }

    function showChoices() {
      const compat = getCompat(currentBaseEmoji);
      if (!compat.length) {
        switchToNewInterlocutor();
        return;
      }

      userInteracted = false;
      emojiCanvas.classList.remove('disabled-all');
      resetCanvas();

      const shuffled = [...compat].sort(() => 0.5 - Math.random());
      const duplicated = [...shuffled, ...shuffled];

      duplicated.forEach(id => {
        const btn = document.createElement('div');
        btn.className = 'choice-btn';
        btn.dataset.id = id;
        const img = document.createElement('img');
        img.src = emojiUrl(id);
        img.onerror = () => { img.style.opacity = '0.3'; };
        btn.appendChild(img);
        btn.onclick = () => handleUserChoice(id);
        emojiCanvas.appendChild(btn);
      });

      startAutoScroll();
      resetInactivityTimer();
    }

    function handleUserChoice(selectedId) {
      if (botAssistantActive) deactivateBotAssistant();
      emojiCanvas.classList.add('disabled-all');
      lastUserEmojiId = selectedId;
      addMessage(selectedId, 'player1');

      setTimeout(() => {
        showMix(currentBaseEmoji, selectedId, (mixUrl) => {
          if (!myFirstMixUrl) myFirstMixUrl = mixUrl;
          myAvatar.src = myFirstMixUrl;

          turnsInCurrentGame++;
          if (turnsInCurrentGame >= maxTurnsForCurrentGame) {
            switchToNewInterlocutor();
            return;
          }
          setTimeout(botRespond, Math.random() * 1000);
        });
      }, 600);
    }

    function showMix(a, b, cb) {
      const i1 = window.points.indexOf(a), i2 = window.points.indexOf(b);
      if (i1 === -1 || i2 === -1) return cb(null);

      const b1 = convertBase(i1, 10, 64), b2 = convertBase(i2, 10, 64);
      const pat1 = new RegExp(`^(\\w+)\\.${b1}\\.${b2}`, 'm');
      const pat2 = new RegExp(`^(\\w+)\\.${b2}\\.${b1}`, 'm');
      const match = window.pairs.match(pat1) || window.pairs.match(pat2);
      if (!match) return cb(null);

      const revPart = match[0].split('.')[0];
      const rev = window.revisions[convertBase(revPart, 64, 10)];
      const order = window.pairs.match(pat2) ? [b, a] : [a, b];
      const url = mixmojiUrl(rev, order);

      addSticker(url);
      currentBaseEmoji = b;
      setTimeout(() => cb(url), 1200);
    }

    function botRespond() {
      if (!interlocutorActive) return;
      const compat = getCompat(currentBaseEmoji);
      if (!compat.length) {
        switchToNewInterlocutor();
        return;
      }
      const choice = compat[Math.floor(Math.random() * compat.length)];
      addMessage(choice, 'player2');
      setTimeout(() => {
        showMix(currentBaseEmoji, choice, () => {
          showChoices();
        });
      }, 1200);
    }

    function showMultilingualMessage(messages, onComplete) {
      const systemDiv = document.createElement('div');
      systemDiv.className = 'message system fade';
      chat.appendChild(systemDiv);
      requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });

      let index = 0;
      const update = () => {
        systemDiv.textContent = messages[index];
        systemDiv.classList.remove('out');
        index = (index + 1) % messages.length;
      };

      update();
      const interval = setInterval(() => {
        systemDiv.classList.add('out');
        setTimeout(() => {
          if (index < messages.length) {
            update();
          } else {
            clearInterval(interval);
            onComplete();
          }
        }, 400);
      }, 1000);

      setTimeout(() => {
        clearInterval(interval);
        onComplete();
      }, 3000);
    }

    function showMultilingualSearchMessage(onComplete) {
      showMultilingualMessage(FRIEND_MESSAGES, onComplete);
    }

    function switchToNewInterlocutor() {
      interlocutorActive = false;
      recentMixUrls = [];
      resetCanvas();

      showMultilingualSearchMessage(() => {
        setTimeout(() => {
          currentGameIndex++;
          turnsInCurrentGame = 0;
          maxTurnsForCurrentGame = getMaxTurnsForGame(currentGameIndex);
          launchNewInterlocutor();
        }, 1500);
      });
    }

    function launchNewInterlocutor() {
      currentBotPersonality = [{ name: 'reserved', likeChance: 0.2 }, { name: 'moderate', likeChance: 0.5 }, { name: 'enthusiast', likeChance: 0.7 }][Math.floor(Math.random() * 3)];
      let avatarUrl = getRandomMixUrl();
      if (!avatarUrl) avatarUrl = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"%3E%3Ccircle cx="30" cy="30" r="28" fill="%23ccc"/%3E%3C/svg%3E';
      theirAvatar.src = avatarUrl;

      currentBaseEmoji = window.points[Math.floor(Math.random() * window.points.length)];
      interlocutorActive = true;
      addMessage(currentBaseEmoji, 'player2');
      showChoices();
    }

    function onManualInteraction() {
      if (useVirtualScroll) {
        switchToNativeScroll();
      }
      resetInactivityTimer();
    }

    choiceArea.addEventListener('wheel', onManualInteraction, { passive: true });
    choiceArea.addEventListener('touchstart', onManualInteraction, { passive: true });
    choiceArea.addEventListener('pointerdown', onManualInteraction);

    refreshBtn.addEventListener('click', () => {
      if (interlocutorActive) {
        switchToNewInterlocutor();
      }
    });

    function activateBotAssistant() {
      if (!interlocutorActive || userInteracted) return;

      showMultilingualMessage(WANT_TO_PLAY_MESSAGES, () => {
        botAssistantActive = true;
        myAvatar.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Ctext x='30' y='40' font-size='32' text-anchor='middle' fill='%23000'%3E🤖%3C/text%3E%3C/svg%3E";
        showScanner();
        autoSelectTimer = setTimeout(() => {
          if (botAssistantActive && interlocutorActive) {
            const compat = getCompat(currentBaseEmoji);
            if (compat.length) {
              const autoChoice = compat[Math.floor(Math.random() * compat.length)];
              handleUserChoice(autoChoice);
            }
          }
        }, AUTO_SELECT_DELAY);
      });
    }

    function deactivateBotAssistant() {
      botAssistantActive = false;
      hideScanner();
      if (myFirstMixUrl) {
        myAvatar.src = myFirstMixUrl;
      } else {
        myAvatar.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Ccircle cx='30' cy='30' r='28' fill='%23007bff'/%3E%3C/svg%3E";
      }
    }

    function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      clearTimeout(autoSelectTimer);
      if (botAssistantActive) deactivateBotAssistant();
      inactivityTimer = setTimeout(activateBotAssistant, INACTIVITY_TIMEOUT);
    }

    function initApp() {
      handleIncomingShare(); // ← сначала проверяем входящую ссылку

      if (!interlocutorActive) {
        showMultilingualSearchMessage(() => {
          setTimeout(() => {
            currentGameIndex = 1;
            turnsInCurrentGame = 0;
            maxTurnsForCurrentGame = getMaxTurnsForGame(currentGameIndex);
            launchNewInterlocutor();
          }, 1500);
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      resetInactivityTimer();
    });
  </script>
</body>
